name: CI

on:
  push:
  pull_request:

jobs:
  verify:
    name: mvn verify (JDK 25)
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up JDK 25 (Temurin)
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Build and verify (all gates)
        run: ./mvnw -B verify
