# The 'persistence' profile: enable the async audit persistence. Flyway builds
# the schema; a real datasource must be supplied (env/props, or Testcontainers in
# tests). Dialect, ddl-auto=none, and open-in-view are inherited from the base
# config. The database is still never in the matching hot path.
spring.flyway.enabled=true

exchange.persistence.capacity=65536
exchange.persistence.max-batch=500
