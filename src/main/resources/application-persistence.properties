# The 'persistence' profile: enable the async audit persistence. Un-exclude the
# DB auto-configs disabled by default, and let Flyway build the schema. A
# datasource must be supplied (env/props, or Testcontainers in tests).
spring.autoconfigure.exclude=

spring.flyway.enabled=true
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

exchange.persistence.capacity=65536
exchange.persistence.max-batch=500
