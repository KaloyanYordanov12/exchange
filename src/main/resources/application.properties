spring.application.name=exchange

# Virtual-thread request handling so many concurrent submitters are cheap.
spring.threads.virtual.enabled=true

# Actuator: expose only the health endpoint for now (Phase 0 scaffold).
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never

# Persistence is OFF by default: the exchange runs fully in-memory and never
# touches the database. The JPA layer is configured lazily so nothing connects at
# startup — the datasource is never used, Flyway is off, Hibernate neither probes
# nor validates, and the DB health check is disabled. The 'persistence' profile
# enables Flyway and supplies a real datasource. The database is never a matching
# dependency in either case.
spring.datasource.url=jdbc:postgresql://localhost:5432/exchange
spring.datasource.username=exchange
spring.datasource.password=exchange
spring.flyway.enabled=false
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
management.health.db.enabled=false

# ---- Exchange configuration ----
exchange.symbol.base=BTC
exchange.symbol.quote=USD
exchange.symbol.tick-size=1
exchange.symbol.lot-size=1
exchange.ingress-capacity=65536

# Real-time broadcast (WebSocket at /ws/marketdata).
exchange.broadcast.book-hertz=10
exchange.broadcast.max-trades-per-flush=256
exchange.broadcast.tape-capacity=1024
exchange.broadcast.client-buffer-size=256

# Demo traders (identity only, not real secrets, $0 build). API keys:
#   account 1 -> "demo-alice-key"
#   account 2 -> "demo-bob-key"
# Hashes are bcrypt; the '$' sequences are literal (no '${' placeholder).
#
# Opening cash is a scaled integer in micro-USD (1e-6 USD), the same unit as order
# prices. 1_000_000_000_000_000 = $1,000,000,000 per trader, deliberately large so the
# demo trades meaningfully on every pair out of the box, including BTC (~$40k) and ETH
# (~$2k), not just the cheap pairs. Cash is shared across all five pairs, so the pool
# must comfortably cover many concurrent resting buys at the high reference prices.
exchange.traders[0].account-id=1
exchange.traders[0].api-key-hash=$2a$10$RJ8lPl6VPgvgx560ku227.cde..lEHztioaFARK/tAJlnmRIkPb3i
exchange.traders[0].cash=1000000000000000
exchange.traders[0].asset=1000
exchange.traders[1].account-id=2
exchange.traders[1].api-key-hash=$2a$10$eEvGRjw3fHMuoNqqAAc1BOupc.Cpyp.q5bCBaXm95jnVOQNQ2HmIq
exchange.traders[1].cash=1000000000000000
exchange.traders[1].asset=1000

# Admin key for the /admin/* surface (demo). API key: "demo-admin-key".
exchange.admin.api-key-hash=$2a$10$y3othRS6kZsM11Duo0E8t.ZlvJhEqD2olWxg6aAFfymXoW29KOuIm

# Continuous invariant checker (public read-only panel at /invariants).
exchange.invariant.check-interval-millis=1000
exchange.invariant.snapshot-timeout-millis=2000

# Synthetic pre-launch candle history (a demo aid). OFF by default: a real run shows
# only real trades. When enabled, labeled SEEDED candles backfill the long timeframes
# so the charts are not empty on day one; real trades from launch append as REAL.
exchange.seed.enabled=false
exchange.seed.base-seed=42
